name: Windows CI and releases

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Check and build Windows x64
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-2022-rust-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
      - name: Set package version from release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/set-release-version.mjs "$env:RELEASE_TAG"
      - run: npm ci
      - name: Type check, format and validate frontend
        run: npm run lint
      - name: Model and isolated adapter tests
        run: npm test
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Build executable and NSIS installer
        run: npm run tauri -- build --ci -- --locked
      - name: Prepare downloads and checksums
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Copy-Item -LiteralPath src-tauri/target/release/lannihilator.exe -Destination artifacts/LANnihilator.exe
          $installers = @(Get-ChildItem -LiteralPath src-tauri/target/release/bundle/nsis -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer.' }
          Copy-Item -LiteralPath $installers[0].FullName -Destination artifacts/LANnihilator-Setup.exe
          Get-FileHash artifacts/*.exe -Algorithm SHA256 | ForEach-Object {
            '{0}  {1}' -f $_.Hash.ToLowerInvariant(), (Split-Path $_.Path -Leaf)
          } | Set-Content artifacts/SHA256SUMS.txt -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: LANnihilator-windows-x64
          retention-days: 14
          if-no-files-found: error
          path: artifacts/

  release:
    name: Publish tagged release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LANnihilator-windows-x64
          path: artifacts
      - name: Publish verified build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd artifacts
          sha256sum --check SHA256SUMS.txt
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            args=()
            if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "LANnihilator $RELEASE_TAG" --generate-notes "${args[@]}"
          fi
          gh release upload "$RELEASE_TAG" LANnihilator.exe LANnihilator-Setup.exe SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false
